name: Build Flutter APK V12

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted
            SEARCH_DIR="extracted"
          else
            echo "No ZIP found, using repository files."
            SEARCH_DIR="."
          fi

          PUBSPEC=$(find "$SEARCH_DIR" -path "*/flutter_app/pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            PUBSPEC=$(find "$SEARCH_DIR" -name "pubspec.yaml" | head -n 1)
          fi
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found."
            find "$SEARCH_DIR" -maxdepth 6 -type f
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "Flutter app found at: $APP_DIR"

      - name: Create Android files if missing
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          if [ ! -d "android" ]; then
            cp pubspec.yaml /tmp/pubspec_backup.yaml
            cp -r lib /tmp/lib_backup
            flutter create . --platforms=android --project-name private_teacher_app
            rm -rf lib
            cp -r /tmp/lib_backup lib
            cp /tmp/pubspec_backup.yaml pubspec.yaml
          fi

      - name: Add Android permissions
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          insert = ''
          for perm in perms:
              name = perm.split('android:name="', 1)[1].split('"', 1)[0]
              if name not in s:
                  insert += '    ' + perm + '\n'
          if insert:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + insert, 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY

      - name: Force Android SDK versions
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = [0-9][0-9]*/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9][0-9]*/minSdk = 23/g' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' android/app/build.gradle
            sed -i 's/targetSdkVersion [0-9][0-9]*/targetSdkVersion 35/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9][0-9]*/minSdkVersion 23/g' android/app/build.gradle
          fi

      - name: Flutter clean
        working-directory: ${{ env.APP_DIR }}
        run: flutter clean

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-teacher-app-v12-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
