name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build APK from ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip uploaded project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Flutter app folder
        run: |
          set -e

          APP_DIR=""

          for PUBSPEC in $(find extracted -name "pubspec.yaml"); do
            DIR=$(dirname "$PUBSPEC")
            if [ -d "$DIR/android" ]; then
              APP_DIR="$DIR"
              break
            fi
          done

          if [ -z "$APP_DIR" ]; then
            echo "Flutter app folder not found. No pubspec.yaml with android folder."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "Flutter app found at: $APP_DIR"

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-teacher-app-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
