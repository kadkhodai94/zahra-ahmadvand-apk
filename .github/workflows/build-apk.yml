name: Build Flutter APK Stable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted
            SEARCH_DIR="extracted"
          else
            echo "No ZIP found, using repository files."
            SEARCH_DIR="."
          fi

          PUBSPEC=$(find "$SEARCH_DIR" -path "*/flutter_app/pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            PUBSPEC=$(find "$SEARCH_DIR" -name "pubspec.yaml" | head -n 1)
          fi
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found."
            find "$SEARCH_DIR" -maxdepth 6 -type f
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "Flutter app found at: $APP_DIR"

      - name: Create Android files if missing
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          if [ ! -d "android" ]; then
            cp pubspec.yaml /tmp/pubspec_backup.yaml
            cp -r lib /tmp/lib_backup
            flutter create . --platforms=android --project-name private_teacher_app
            rm -rf lib
            cp -r /tmp/lib_backup lib
            cp /tmp/pubspec_backup.yaml pubspec.yaml
          fi

      - name: Add internet permission
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET" \/>/g' "$MANIFEST"
          fi

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-teacher-app-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
