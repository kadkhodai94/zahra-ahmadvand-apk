name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find and unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -printf "%f\n" | sort -V | tail -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in repository root."
            exit 1
          fi

          echo "Found zip file: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Flutter project
        id: find_project
        run: |
          PROJECT_DIR=$(find extracted -name pubspec.yaml -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found."
            exit 1
          fi

          echo "Flutter project found: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Recreate Android folder for current Flutter
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --org ir.miplus \
            --project-name gamino \
            .

      - name: Install Gamino launcher icons
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          mkdir -p android/app/src/main/res
          cp -r assets/android_icon/mipmap-* android/app/src/main/res/

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="گامینو"/' android/app/src/main/AndroidManifest.xml
            sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/' android/app/src/main/AndroidManifest.xml

            if ! grep -q "android:roundIcon" android/app/src/main/AndroidManifest.xml; then
              sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' android/app/src/main/AndroidManifest.xml
            fi
          fi

          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install private Gamino signing key
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        env:
          GAMINO_KEYSTORE_BASE64: ${{ secrets.GAMINO_KEYSTORE_BASE64 }}
          GAMINO_STORE_PASSWORD: ${{ secrets.GAMINO_STORE_PASSWORD }}
          GAMINO_KEY_PASSWORD: ${{ secrets.GAMINO_KEY_PASSWORD }}
          GAMINO_KEY_ALIAS: ${{ secrets.GAMINO_KEY_ALIAS }}
        run: |
          if [ -z "$GAMINO_KEYSTORE_BASE64" ] || [ -z "$GAMINO_STORE_PASSWORD" ] || [ -z "$GAMINO_KEY_PASSWORD" ] || [ -z "$GAMINO_KEY_ALIAS" ]; then
            echo "Missing Gamino signing secrets."
            exit 12
          fi

          mkdir -p android/app

          echo "$GAMINO_KEYSTORE_BASE64" | base64 --decode > android/app/gamino-release-key.jks

          cat > android/key.properties <<EOF
          storePassword=$GAMINO_STORE_PASSWORD
          keyPassword=$GAMINO_KEY_PASSWORD
          keyAlias=$GAMINO_KEY_ALIAS
          storeFile=gamino-release-key.jks
          EOF

          sed -i 's/^          //' android/key.properties

          echo "key.properties created"
          test -f android/app/gamino-release-key.jks

      - name: Patch Android signing config
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          cat > android/app/build.gradle.kts <<'EOF'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "ir.miplus.gamino"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              defaultConfig {
                  applicationId = "ir.miplus.gamino"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          flutter {
              source = "../.."
          }
          EOF

          sed -i 's/^          //' android/app/build.gradle.kts

          echo "build.gradle.kts patched for Gamino signing and JVM 17"
          test -f android/app/build.gradle.kts

      - name: Get Flutter packages
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: flutter pub get

      - name: Build protected release APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --android-skip-build-dependency-validation

      - name: Rename APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/gamino-v75.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamino-v75-apk
          path: ${{ steps.find_project.outputs.project_dir }}/output/gamino-v75.apk
